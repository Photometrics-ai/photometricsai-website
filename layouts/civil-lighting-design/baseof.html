<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ with .Params.seo_title }}{{ . }}{{ else }}{{ .Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description }}">
  <link rel="canonical" href="{{ .Permalink }}">

  {{ if .Params.noindex }}<meta name="robots" content="noindex, follow">{{ end }}

  <link rel="icon" type="image/png" href="/images/favicon.png">

  {{ partial "analytics.html" . }}

  {{ $ogImage := printf "%simages/og-image.jpg" .Site.BaseURL }}
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:title" content="{{ with .Params.seo_title }}{{ . }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ .Description }}">
  <meta property="og:image" content="{{ $ogImage }}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta property="og:site_name" content="Photometrics AI">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ .Permalink }}">
  <meta name="twitter:title" content="{{ with .Params.seo_title }}{{ . }}{{ else }}{{ .Title }}{{ end }}">
  <meta name="twitter:description" content="{{ .Description }}">
  <meta name="twitter:image" content="{{ $ogImage }}">
  {{ with .Site.Params.twitterHandle }}<meta name="twitter:site" content="{{ . }}">{{ end }}

  <!-- Organization Schema (JSON-LD) -->
  {{ partial "schema-org.html" . }}
  {{ partial "schema-breadcrumbs.html" . }}

  <!-- Fonts: Cormorant Garamond (display) + Work Sans (body) — brand-assets canonical URL -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Work+Sans:wght@300;400;500;600&display=swap"></noscript>

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/civil-lighting-design.css">
</head>
<body>
  {{ block "main" . }}{{ end }}
</body>
</html>
