<!-- Google Analytics (deferred to first interaction or window 'load', so it doesn't compete with the LCP element for main-thread time) -->
{{ with .Site.Params.googleAnalytics }}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ . }}');

  (function() {
    var loaded = false;
    function loadGA() {
      if (loaded) return;
      loaded = true;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id={{ . }}';
      document.head.appendChild(s);
      events.forEach(function(evt) { window.removeEventListener(evt, loadGA, { passive: true }); });
    }
    var events = ['scroll', 'mousemove', 'keydown', 'touchstart'];
    events.forEach(function(evt) { window.addEventListener(evt, loadGA, { passive: true, once: true }); });
    window.addEventListener('load', loadGA, { once: true });
  })();
</script>
{{ end }}
