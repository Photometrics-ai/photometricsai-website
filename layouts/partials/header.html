<a href="#main-content" class="skip-to-content">Skip to content</a>
<header class="site-header" id="site-header">
  <nav class="nav-container">
    <a href="/" class="logo">
      <img src="/images/logo-white.png" alt="Photometrics AI" width="188" height="32" class="logo-dark">
      <img src="/images/logo-dark.png" alt="Photometrics AI" width="166" height="32" class="logo-light">
    </a>

    <button class="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links" onclick="toggleMobileMenu()">
      <span class="hamburger"></span>
    </button>

    <ul class="nav-links" id="nav-links">
      {{ range .Site.Menus.main }}
        {{ if .HasChildren }}
        <li class="nav-dropdown">
          <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>
          <ul class="nav-dropdown-menu">
            {{ range .Children }}
            <li><a href="{{ .URL }}">{{ .Name }}</a></li>
            {{ end }}
          </ul>
        </li>
        {{ else }}
        <li><a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
      <li><a href="https://beta2.photometrics.ai/" class="nav-cta" target="_blank" rel="noopener">Use Beta</a></li>
    </ul>
  </nav>
</header>
