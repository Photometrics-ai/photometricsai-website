<!--
  Civil Lighting Design — matchline section divider (reusable snippet)
  ======================================================================
  Not baked into email-template.html because not every issue has multiple
  named sections. When an issue does, paste this into Buttondown's raw-HTML
  block between sections and replace {SECTION NAME}. Duplicate as needed.

  Matches the mockup: a full-width dashed rule, then a separate centered
  caption line below it (not a label embedded in the line itself).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:32px 0 8px;">
<tr><td style="border-top:1px dashed #c9d0d8;font-size:0;line-height:0;">&nbsp;</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
<tr><td align="center" style="font-family:'Courier New',Courier,monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#718096;">
  MATCH LINE &mdash; {SECTION NAME}
</td></tr>
</table>
